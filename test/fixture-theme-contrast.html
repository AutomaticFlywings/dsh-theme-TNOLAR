<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>DSH theme contrast regression fixture</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,'Microsoft YaHei',sans-serif}
/* Simulate a light DSH token sheet left under the dark plugin; this used to
   produce unreadable white inline-code pills and white add controls. */
:root{--dsw-alias-bg-base:#fff;--dsw-alias-bg-layer-1:#f8fafb;--dsw-alias-label-primary:#1b252c;--dsw-alias-markdown-inline-code:#f8f9fa;--dsw-alias-markdown-code-block:#f5f7f9;--dsw-specific-selector:#f9fafb;--dsw-alias-label-secondary:#667d82;--dsw-alias-link:#238c9e;--dsw-alias-state-business-primary:#1d8cab}
body,#root{background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
#root{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.sidebarCol__fixture{padding:26px;background:#f5f7fa;border-right:1px solid #ddd}.panelRow__fixture{padding:12px 14px;margin-top:8px}.panelRow__fixture.panelActive__fixture{background:#ddd}
.centerCol__fixture{min-width:0;padding:12px 26px 48px}.ConversationRoot_header__fixture{margin-bottom:15px;border-bottom:1px solid #adbcc1}.titleRow__fixture{height:32px;display:flex;align-items:center}.tabs__fixture{display:flex;gap:18px;height:34px;align-items:start;padding-left:8px}
.ConversationRoot_tab__fixture{--dsh-tab-hit-inline:10px;position:relative;box-sizing:border-box;min-height:35px;margin:-10px calc(-1 * var(--dsh-tab-hit-inline)) 0;padding:10px var(--dsh-tab-hit-inline) 9px;border:0;background:transparent;color:var(--dsw-alias-label-secondary);font-size:13px;line-height:16px;cursor:pointer}
.ConversationRoot_tab__fixture::after{content:'';position:absolute;left:var(--dsh-tab-hit-inline);right:var(--dsh-tab-hit-inline);bottom:-1px;height:2px;background:transparent}.ConversationRoot_tabActive__fixture{color:var(--dsw-alias-state-business-primary)}.ConversationRoot_tabActive__fixture::after{background:var(--dsw-alias-state-business-primary)}
main{max-width:990px;line-height:1.65}.fixture-row{margin:18px 0;padding:17px;border:1px solid #b1c8d0;border-radius:12px}.fixture-row h2{font-size:16px;margin:0 0 14px}.MarkdownText_markdown__fixture{font-size:15px}.MarkdownText_markdown__fixture :not(pre)>code{display:inline-flex;align-items:center;font:13px/1.7 monospace;padding:0 5px;background:var(--dsw-alias-markdown-inline-code);border:1px solid #ccc;border-radius:5px}.MarkdownText_markdown__fixture pre{background:var(--dsw-alias-markdown-code-block);padding:10px;color:inherit}.MarkdownText_markdown__fixture pre code{background:none;padding:0}.MarkdownText_fileMention__fixture{border:0;padding:0;background:none;color:var(--dsw-alias-link)}
.InputBar_card__fixture{border:1px solid #ccc;max-width:700px;padding:10px;background:var(--dsw-alias-bg-layer-1);border-radius:14px}.InputBar_row__fixture{display:flex;align-items:center;gap:13px}.InputBar_add__fixture{display:grid;place-items:center;width:28px;height:28px;border:0;background:var(--dsw-specific-selector);color:var(--dsw-alias-label-primary);border-radius:50%;cursor:pointer}.InputBar_add__fixture:disabled{opacity:.5}.InputBar_primary__fixture{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:#a9dedd;color:#fff;cursor:pointer;opacity:1}.InputBar_primary__fixture:disabled{opacity:.4}.InputBar_primary__fixture:not(:disabled){opacity:1}
button svg{width:16px;height:16px}.spacer{flex:1}.label{color:var(--dsw-alias-label-secondary);font-size:13px}.fixture-menu{display:inline-flex;flex-direction:column;gap:6px;min-width:160px;padding:10px;border-radius:8px;background:#f8fafb;color:#333}.fixture-menu button{font:14px system-ui;padding:7px;text-align:left;border:0;background:transparent;color:inherit}

.ChatView_toBottom__fixture{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;border-radius:50%;background:#f8fafb;color:#253238;cursor:pointer}
.DiscoverSection_categories__fixture{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.Pill_pill__fixture{height:24px;padding:0 8px;border:0;border-radius:999px;background:#f9fafb;color:#30383c;font-size:12px}
.Pill_active__fixture{background:#fcfdff}
</style></head><body><div id="root"><aside class="sidebarCol__fixture"><strong>DSH HARNESS</strong><div class="panelRow__fixture panelActive__fixture">工作区 / 已选中</div><div class="panelRow__fixture">插件市场</div></aside><div class="centerCol__fixture"><div class="ConversationRoot_header__fixture"><div class="titleRow__fixture">工作区 / 主题对比度回归</div><div class="tabs__fixture" role="tablist"><button type="button" id="tab-active" role="tab" aria-selected="true" class="ConversationRoot_tab__fixture ConversationRoot_tabActive__fixture">对话</button><button type="button" id="tab-inactive" role="tab" aria-selected="false" class="ConversationRoot_tab__fixture">轨迹</button></div></div><main>
  <section class="fixture-row MarkdownText_markdown__fixture" id="md"><h2>Markdown / 行内代码</h2><p>安装配置记录保存在 <code id="inline-code">package.json</code>，执行 <code>pnpm remove</code> 并检查 <code><button class="MarkdownText_fileMention__fixture" type="button">README.zh.md</button></code>。</p><pre id="code-block"><code>const enabled = true; // 代码块背景必须是深色</code></pre></section>
  <section class="fixture-row"><h2>输入区 / 真实类名</h2><div class="InputBar_card__fixture"><div style="height:54px;color:#b4d5d3">发送消息或创建任务</div><div class="InputBar_row__fixture"><button class="InputBar_add__fixture" id="add-button" type="button" aria-label="打开命令菜单"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v12M2 8h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button><span class="label">工作区内修改</span><span class="spacer"></span><button id="send-disabled" class="InputBar_primary__fixture" aria-label="发送" type="button" disabled><svg viewBox="0 0 16 16" fill="none"><path d="M8 13V3m0 0L3 8m5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="send-enabled" class="InputBar_primary__fixture" aria-label="发送" type="button"><svg viewBox="0 0 16 16" fill="none"><path d="M8 13V3m0 0L3 8m5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></section>
  <section class="fixture-row"><h2>菜单 / 状态</h2><div class="fixture-menu" role="menu" id="menu"><button role="menuitem">设置</button><button role="menuitem">插件管理</button><button role="menuitem">退出</button></div><span class="label" style="margin-left:20px">只改颜色，不改图标几何或标签点击区域</span>
    <div style="display:flex;align-items:center;gap:24px;margin-top:18px">
      <button class="ChatView_toBottom__fixture" id="to-bottom" type="button" aria-label="回到底部">⌄</button>
      <div class="DiscoverSection_categories__fixture" role="group" aria-label="插件分类">
        <button class="Pill_pill__fixture Pill_active__fixture" id="category-active" aria-pressed="true">全部</button>
        <button class="Pill_pill__fixture" id="category-idle" aria-pressed="false">AGI 架构探索</button>
      </div>
    </div></section>
</main></div></div></body></html>
